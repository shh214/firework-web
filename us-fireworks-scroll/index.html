<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#101010">
  <link rel="icon" href="data:,">
  <title>美国独立日烟花 · 从球体到十城矩阵</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="../us-fireworks-cloud/cloud-data.js"></script>
  <script defer src="../us-fireworks-sphere/sphere-data.js"></script>
  <script defer src="../us-fireworks-sphere/layout.js"></script>
  <script defer src="matrix-layout.js"></script>
  <script defer src="vendor/gsap.min.js"></script>
  <script defer src="vendor/ScrollTrigger.min.js"></script>
  <script defer src="renderer.js"></script>
  <script defer src="story.js"></script>
</head>
<body>
  <main id="scene">
    <canvas id="cloud" tabindex="0" class="rotatable" role="img" aria-label="美国独立日烟花照片云。拖动旋转球体；向下滚动，照片进入各自的城市矩阵，向上滚动返回。"></canvas>
    <svg id="cities" role="group" aria-label="矩阵所属城市" aria-hidden="true"></svg>
    <p id="failure" role="alert" hidden>未能载入照片，请重新打开页面。</p>
    <noscript>请启用 JavaScript 查看照片转场。</noscript>
  </main>
</body>
</html>
