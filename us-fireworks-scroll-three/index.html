<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="data:,">
  <title>美国独立日烟花 · 球体、城市矩阵与烟花色带</title>
  <link rel="stylesheet" href="../us-fireworks-scroll/style.css">
  <script defer src="../us-fireworks-cloud/cloud-data.js"></script>
  <script defer src="../us-fireworks-sphere/sphere-data.js"></script>
  <script defer src="../us-fireworks-sphere/layout.js"></script>
  <link rel="stylesheet" href="style.css?v=boston-scroll-sequence">
  <script defer src="circle-layout.js"></script>
  <script defer src="../us-fireworks-scroll/matrix-layout.js"></script>
  <script defer src="../us-fireworks-scroll/vendor/gsap.min.js"></script>
  <script defer src="../us-fireworks-scroll/vendor/ScrollTrigger.min.js"></script>
  <script defer src="assets/boston-water.js"></script>
  <script defer src="boston-river.js?v=boston-scroll-sequence"></script>
  <script defer src="renderer.js?v=boston-firework-preview"></script>
  <script defer src="story.js?v=boston-scroll-sequence"></script>
</head>
<body>
  <main>
    <div id="story-track">
      <div id="scene">
        <canvas id="cloud" tabindex="0" class="rotatable" role="img" aria-label="美国独立日烟花照片云。拖动旋转球体。向下滚动，照片进入各自的城市矩阵，再变为按城市聚集的烟花色圆。选择城市可进入第四幕，向上滚动可逐幕返回。"></canvas>
        <svg id="cities" role="group" aria-label="矩阵所属城市" aria-hidden="true"></svg>
        <svg id="axis" aria-hidden="true"></svg>
        <div id="city-entries" role="group" aria-label="选择城市进入第四幕" hidden></div>
        <p id="failure" role="alert" hidden>未能载入照片，请重新打开页面。</p>
        <noscript>请启用 JavaScript 查看照片转场。</noscript>
      </div>
      <div id="story-runway" aria-hidden="true"></div>
      <div id="third-act-hold" aria-hidden="true"></div>
    </div>
    <section id="next-act" aria-labelledby="next-act-title" hidden>
      <h2 id="next-act-title" tabindex="-1">第四幕</h2>
      <div id="boston-river" hidden>
        <div class="boston-river-viewport">
          <div class="boston-river-map">
            <img src="assets/boston-charles-river-black-white.svg" width="1486" height="858" decoding="async" alt="波士顿与剑桥之间的查尔斯河。波士顿烟花照片的色圆随滚动落入河道。">
            <svg class="boston-river-banks" viewBox="0 0 1486 858" aria-hidden="true">
              <path></path>
            </svg>
          </div>
          <div class="boston-river-previews" aria-hidden="true"></div>
          <canvas class="boston-river-circles" aria-hidden="true"></canvas>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
