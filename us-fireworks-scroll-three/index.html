<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="data:,">
  <title>Fourth of July Fireworks</title>
  <link rel="stylesheet" href="../us-fireworks-scroll/style.css">
  <script defer src="../us-fireworks-cloud/cloud-data.js"></script>
  <script defer src="../us-fireworks-sphere/sphere-data.js"></script>
  <script defer src="../us-fireworks-sphere/layout.js"></script>
  <link rel="stylesheet" href="style.css?v=city-axis-switch-complete-cutouts">
  <script defer src="circle-layout.js"></script>
  <script defer src="../us-fireworks-scroll/matrix-layout.js"></script>
  <script defer src="../us-fireworks-scroll/vendor/gsap.min.js"></script>
  <script defer src="assets/boston-water.js"></script>
  <script defer src="boston-river.js?v=shared-insets"></script>
  <script defer src="renderer.js?v=color-explanation"></script>
  <script defer src="city-layout.js?v=city-firework-bloom"></script>
  <script defer src="color-explanation.js?v=city-axis-switch-complete-cutouts"></script>
  <script defer src="assets/photo-captions.js"></script>
  <script defer src="photo-explorer.js"></script>
  <script defer src="story.js?v=city-axis-return"></script>
</head>
<body>
  <main>
    <nav id="axis" aria-label="Cities" tabindex="-1" inert>
      <svg class="city-axis-ticks" aria-hidden="true"></svg>
    </nav>
    <div id="story-track">
      <div id="scene">
        <canvas id="cloud" tabindex="0" class="rotatable" role="img" aria-label="A globe of Fourth of July fireworks photographs. Drag to rotate. Scroll down to explore the city groups, seven fireworks colors, and city color bands. Select a city, then scroll down to see its firework. Scroll up to go back."></canvas>
        <aside id="photo-list" aria-label="Browse original fireworks photographs" hidden></aside>
        <div id="photo-field" hidden></div>
        <svg id="cities" role="group" aria-label="Cities in the photo grid" aria-hidden="true"></svg>
        <section id="color-explanation" aria-label="The colors of fireworks">
          <h2 class="color-question" aria-hidden="true">Why do fireworks have different colors?</h2>
          <div class="color-gallery" aria-hidden="true"></div>
          <div class="color-captions">
            <p class="color-summary" aria-hidden="true">Seven fireworks colors</p>
            <p class="color-point-caption" aria-hidden="true">One dot for each color</p>
          </div>
        </section>
        <div id="city-entries" aria-hidden="true" hidden></div>
        <p id="failure" role="alert" hidden>The photos could not load. Please reload this page.</p>
        <noscript>Enable JavaScript to view the photo transitions.</noscript>
      </div>
      <div id="story-runway" aria-hidden="true">
        <div id="matrix-runway"></div>
        <div id="color-runway"></div>
      </div>
      <div id="third-act-hold" aria-hidden="true"></div>
    </div>
    <section id="next-act" aria-labelledby="next-act-title" hidden>
      <h2 id="next-act-title" tabindex="-1">Act IV</h2>
      <div id="boston-river" hidden>
        <div class="boston-river-viewport">
          <div class="boston-river-map">
            <img src="assets/boston-charles-river-black-white.svg" width="1486" height="858" decoding="async" alt="The Charles River between Boston and Cambridge. As you scroll, colored dots from Boston fireworks photographs move into the river.">
            <svg class="boston-river-banks" viewBox="0 0 1486 858" aria-hidden="true">
              <path></path>
            </svg>
          </div>
          <canvas class="boston-river-circles" aria-hidden="true"></canvas>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
